<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>詰碁道場</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Zen+Old+Mincho:wght@600;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e5e8ea; --surface:#f3f4f5; --ink:#1d2329; --muted:#5b6670; --line:#c6ccd1;
  --ai:#2a4a73; --ai-soft:#d7e0eb; --ok:#2f6f48; --ok-soft:#d8eadf; --ng:#9c3436; --ng-soft:#f1dcdc;
  --kaya1:#e6bd6e; --kaya2:#d5a24f; --grid:#4a3417;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#14181c; --surface:#1d2329; --ink:#e3e7ea; --muted:#9aa5ae; --line:#323b43;
    --ai:#9bb7de; --ai-soft:#24344a; --ok:#7cc495; --ok-soft:#1f3529; --ng:#e48a8b; --ng-soft:#3b2324;
    --kaya1:#cfa257; --kaya2:#b98a3c; --grid:#3a2810;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#14181c; --surface:#1d2329; --ink:#e3e7ea; --muted:#9aa5ae; --line:#323b43;
  --ai:#9bb7de; --ai-soft:#24344a; --ok:#7cc495; --ok-soft:#1f3529; --ng:#e48a8b; --ng-soft:#3b2324;
  --kaya1:#cfa257; --kaya2:#b98a3c; --grid:#3a2810; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;line-height:1.7;-webkit-tap-highlight-color:transparent}
.wrap{max-width:1080px;margin:0 auto;padding:20px 20px 40px}
header{display:flex;align-items:baseline;gap:16px;margin-bottom:18px;flex-wrap:wrap}
h1{font-family:"Zen Old Mincho","Hiragino Mincho ProN","Yu Mincho",serif;font-weight:900;font-size:2rem;letter-spacing:.12em;margin:0}
.progress{color:var(--muted);font-size:.95rem}
.progress b{color:var(--ink);font-weight:700}
main{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(300px,1fr);gap:28px;align-items:start}
@media (max-width:820px){main{grid-template-columns:1fr;gap:18px}}
.boardbox{position:relative}
.boardbox svg{display:block;width:100%;height:auto;border-radius:6px;box-shadow:0 1px 0 rgba(0,0,0,.08),0 10px 30px -12px rgba(40,25,5,.45);touch-action:manipulation;cursor:pointer;user-select:none}
.panel{display:flex;flex-direction:column;gap:16px}
.qhead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.qno{font-family:"Zen Old Mincho",serif;font-weight:900;font-size:1.6rem;line-height:1.2}
.lvtag{font-size:.85rem;color:var(--muted)}
.task{font-family:"Zen Old Mincho",serif;font-weight:600;font-size:1.25rem;margin:2px 0 0}
.task small{font-family:"Zen Kaku Gothic New",sans-serif;font-weight:400;font-size:.9rem;color:var(--muted);margin-left:.6em}
.msg{border-radius:8px;padding:12px 14px;background:var(--surface);border-left:4px solid var(--line);min-height:3.4em;font-size:.98rem}
.msg.ok{background:var(--ok-soft);border-color:var(--ok)}
.msg.ng{background:var(--ng-soft);border-color:var(--ng)}
.msg.hint{background:var(--ai-soft);border-color:var(--ai)}
.msg strong{display:block;font-size:1.05rem}
.btns{display:flex;flex-wrap:wrap;gap:8px}
button{font:inherit;font-size:.95rem;border-radius:999px;padding:8px 16px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;min-height:40px}
button:hover:not(:disabled){border-color:var(--ai)}
button:focus-visible{outline:3px solid var(--ai);outline-offset:2px}
button:disabled{opacity:.45;cursor:default}
button.primary{background:var(--ai);border-color:var(--ai);color:var(--surface);font-weight:700}
.hintbtn{border-color:var(--ai);color:var(--ai);font-weight:700}
.list{background:var(--surface);border-radius:10px;padding:14px 16px}
.list h2{font-family:"Zen Old Mincho",serif;font-size:1.05rem;margin:10px 0 6px;font-weight:600;display:flex;justify-content:space-between}
.list h2:first-child{margin-top:0}
.list h2 span{font-family:"Zen Kaku Gothic New",sans-serif;font-size:.82rem;color:var(--muted);font-weight:400}
.nums{display:flex;flex-wrap:wrap;gap:6px}
.nums button{width:40px;height:40px;padding:0;border-radius:50%;font-size:.9rem;min-height:0}
.nums button.solved{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.nums button.cur{outline:3px solid var(--ai);outline-offset:2px}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:.82rem;color:var(--muted)}
.foot button{font-size:.82rem;min-height:32px;padding:4px 12px}
.legend{font-size:.85rem;color:var(--muted);margin:8px 2px 0}
@keyframes drop{from{transform:scale(1.18);opacity:.3}to{transform:scale(1);opacity:1}}
.new{animation:drop .18s ease-out;transform-box:fill-box;transform-origin:center}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.mark{animation:pulse 1.4s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.new,.mark{animation:none}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>詰碁道場</h1>
  <div class="progress" id="prog"></div>
</header>
<main>
  <section class="boardbox">
    <svg id="board" role="img" aria-label="碁盤"></svg>
    <p class="legend">盤上をタップして黒石を打ちます。左と上の太い線が盤の端です。<br>上級以上の問題は、白の応手に正しく応じて最後まで打ち切ると正解です。</p>
  </section>
  <section class="panel">
    <div>
      <div class="qhead"><span class="qno" id="qno"></span><span class="lvtag" id="lvtag"></span></div>
      <p class="task" id="task"></p>
    </div>
    <div class="msg" id="msg" aria-live="polite"></div>
    <div class="btns">
      <button class="hintbtn" id="hintBtn">ヒント</button>
      <button id="resetBtn">やり直す</button>
      <button id="ansBtn">答えを見る</button>
      <button class="primary" id="nextBtn">次の問題</button>
    </div>
    <nav class="list" id="list" aria-label="問題一覧"></nav>
  </section>
</main>
</div>

  ko=null;node=P.tree;state='play';last=null;hintLv=0;marks=[];extra=[];fresh=null;usedHelp=false;
  $('qno').textContent='第'+idxInLv[i]+'問';
  $('lvtag').textContent=LV[P.lv];
  const t=TASK[P.mode];$('task').innerHTML=t[0]+'<small>'+t[1]+'</small>';
  setMsg('','黒番です。','');
  updButtons();render();renderList();
}
function setMsg(cls,title,body){const m=$('msg');m.className='msg '+cls;m.innerHTML=(title?'<strong>'+title+'</strong>':'')+(body||'')}
function updButtons(){
  $('hintBtn').disabled=!(state==='play')||hintLv>=2;
  $('hintBtn').textContent=hintLv===0?'ヒント':'急所を見せる';
  $('ansBtn').disabled=state==='demo';
  $('nextBtn').disabled=cur>=DATA.length-1;
}

// --- rules
function nbrs(x,y){const r=[];for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){const X=x+dx,Y=y+dy;if(X<0||Y<0)continue;r.push([X,Y])}return r}
function group(g,x,y){
  const c=g[y][x],seen=new Set([x+','+y]),st=[[x,y]],libs=new Set();let inf=false;
  while(st.length){const[a,b]=st.pop();for(const[X,Y]of nbrs(a,b)){if(X>=W||Y>=H){inf=true;continue}const v=g[Y][X];const k=X+','+Y;if(v==='.')libs.add(k);else if(v===c&&!seen.has(k)){seen.add(k);st.push([X,Y])}}}
  return{stones:[...seen],libs,inf};
}
function tryPlay(c,x,y){
  if(grid[y][x]!=='.')return null;
  if(ko===x+','+y)return null;
  const g=grid.map(r=>r.slice());g[y][x]=c;const o=c==='X'?'O':'X';const cap=new Set();
  for(const[X,Y]of nbrs(x,y)){if(X>=W||Y>=H)continue;if(g[Y][X]===o){const gr=group(g,X,Y);if(!gr.inf&&gr.libs.size===0)gr.stones.forEach(s=>{cap.add(s);const[a,b]=s.split(',').map(Number);g[b][a]='.'})}}
  const me=group(g,x,y);if(!me.inf&&me.libs.size===0)return null;
  let nko=null;if(cap.size===1&&me.stones.length===1&&!me.inf&&me.libs.size===1)nko=[...cap][0];
  return{g,nko};
}
function commit(c,x,y){const r=tryPlay(c,x,y);if(!r)return false;grid=r.g;ko=r.nko;last=[x,y];fresh=x+','+y;marks=[];return true}

// --- interaction
function onBoard(x,y){
  if(state!=='play')return;
  const key=x+','+y;
  const inR=x<W&&y<H&&region[y][x];
  if(x<W&&y<H){
    if(grid[y][x]!=='.')return;
    if(!tryPlay('X',x,y)){setMsg('','そこには打てません。','着手禁止点(自殺手かコウ)です。');return}
  }
  if(inR&&node.ok[key]!==undefined){
    commit('X',x,y);const v=node.ok[key];
    if(v===null){win();return}
    state='busy';render();setMsg('','いい手です。','白が応じます…');updButtons();
    setTimeout(()=>{commit('O',v.r[0],v.r[1]);node=v.n;state='play';
      if(!node||Object.keys(node.ok).length===0){win();return}
      setMsg('','白が打ちました。','続けて黒番です。');updButtons();render()},520);
    return;
  }
  // wrong
  if(x<W&&y<H)commit('X',x,y);else{extra.push([x,y]);last=[x,y];fresh=key}
  const ref=inR?node.ng[key]:null;
  state='lose';updButtons();render();
  if(ref){setMsg('ng','不正解','白の応手を見てみましょう…');
    setTimeout(()=>{if(state!=='lose')return;commit('O',ref[0],ref[1]);render();
      setMsg('ng','不正解',(P.mode==='live'?'白にこう打たれると、黒は2眼を作れません。':P.mode==='semeai'?'白にこう打たれると、攻め合いに負けてしまいます。':P.mode==='kill'?'白にこう打たれると、白は生きてしまいます。':'白に逃げられてしまいました。')+'「やり直す」でもう一度。')},520)}
  else setMsg('ng','不正解','その手では解決しません。「やり直す」でもう一度。');
}
function win(){
  state='win';marks=[];
  if(!usedHelp){solved.add(cur);save()}
  setMsg('ok','正解!',WIN[P.mode]+(usedHelp?' 答えを見たので、記録はつきません。もう一度自力で解いてみましょう。':''));
  updButtons();render();renderList();
}
function hint(){
  if(state!=='play')return;
  if(hintLv===0){hintLv=1;setMsg('hint','ヒント',P.hint)}
  else{hintLv=2;marks=Object.keys(node.ok).map(k=>k.split(',').map(Number));setMsg('hint','急所はここ',P.hint)}
  updButtons();render();
}
function demo(){
  load(cur);usedHelp=true;state='demo';updButtons();setMsg('hint','答えの手順','正解手順を再生しています。');
  const steps=[];let n=P.tree;
  while(n&&Object.keys(n.ok).length){const k=Object.keys(n.ok)[0];steps.push(['X',k.split(',').map(Number)]);const v=n.ok[k];if(!v)break;steps.push(['O',v.r]);n=v.n}
  let i=0;const step=()=>{if(i>=steps.length){state='win';setMsg('hint','答えの手順','これが正解の手順です。「やり直す」で自分でも打ってみましょう。');updButtons();render();return}
    const[c,[x,y]]=steps[i++];commit(c,x,y);render();demoTimer=setTimeout(step,850)};
  demoTimer=setTimeout(step,500);
}

// --- render
const U=40,M=30;
function render(){
  const svg=$('board');const w=M+(C-1)*U+U*0.7,h=M+(R-1)*U+U*0.7;
  svg.setAttribute('viewBox','0 0 '+w+' '+h);
  let s='<defs><radialGradient id="gb" cx="35%" cy="30%" r="70%"><stop offset="0" stop-color="#5a6068"/><stop offset=".35" stop-color="#1c1f23"/><stop offset="1" stop-color="#050607"/></radialGradient>'+
  '<radialGradient id="gw" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#ffffff"/><stop offset=".6" stop-color="#eef0ef"/><stop offset="1" stop-color="#c7cbc8"/></radialGradient>'+
  '<linearGradient id="wood" x1="0" y1="0" x2="1" y2=".3"><stop offset="0" stop-color="var(--kaya1)"/><stop offset="1" stop-color="var(--kaya2)"/></linearGradient></defs>';
  s+='<rect width="'+w+'" height="'+h+'" fill="url(#wood)"/>';
  for(let i=0;i<9;i++){const y=(i+.5)*h/9+Math.sin(i*1.7)*6;s+='<path d="M0 '+y.toFixed(1)+' Q '+(w*.35)+' '+(y+9*Math.sin(i)).toFixed(1)+' '+(w*.6)+' '+(y-4).toFixed(1)+' T '+w+' '+(y+5).toFixed(1)+'" stroke="#7a5420" stroke-opacity=".09" stroke-width="'+(1+i%3)+'" fill="none"/>'}
  for(let x=0;x<C;x++){const X=M+x*U;s+='<line x1="'+X+'" y1="'+M+'" x2="'+X+'" y2="'+h+'" stroke="var(--grid)" stroke-width="'+(x===0?2.6:1)+'"/>'}
  for(let y=0;y<R;y++){const Y=M+y*U;s+='<line x1="'+M+'" y1="'+Y+'" x2="'+w+'" y2="'+Y+'" stroke="var(--grid)" stroke-width="'+(y===0?2.6:1)+'"/>'}
  if(C>3&&R>3)s+='<circle cx="'+(M+3*U)+'" cy="'+(M+3*U)+'" r="3.6" fill="var(--grid)"/>';
  const stone=(x,y,c)=>{const cx=M+x*U,cy=M+y*U,k=x+','+y;const cls=k===fresh?' class="new"':'';
    return '<g'+cls+'><circle cx="'+(cx+1.5)+'" cy="'+(cy+2.5)+'" r="18.6" fill="#000" opacity=".22"/><circle cx="'+cx+'" cy="'+cy+'" r="18.6" fill="url(#'+(c==='X'?'gb':'gw')+')"'+(c==='O'?' stroke="#9da29f" stroke-width=".6"':'')+'/></g>'};
  for(let y=0;y<H;y++)for(let x=0;x<W;x++)if(grid[y][x]!=='.')s+=stone(x,y,grid[y][x]);
  extra.forEach(([x,y])=>s+=stone(x,y,'X'));
  if(last){const[x,y]=last;const c=(x<W&&y<H)?grid[y][x]:'X';if(c!=='.')s+='<circle cx="'+(M+x*U)+'" cy="'+(M+y*U)+'" r="6" fill="none" stroke="'+(c==='X'?'#fff':'#111')+'" stroke-width="2"/>'}
  marks.forEach(([x,y])=>{s+='<circle class="mark" cx="'+(M+x*U)+'" cy="'+(M+y*U)+'" r="15" fill="none" stroke="#1f4fa0" stroke-width="3.5" stroke-dasharray="5 4"/>'});
  svg.innerHTML=s;fresh=null;
}
$('board').addEventListener('click',e=>{
  const svg=$('board');const pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;
  const p=pt.matrixTransform(svg.getScreenCTM().inverse());
  const x=Math.round((p.x-M)/U),y=Math.round((p.y-M)/U);
  if(x<0||y<0||x>=C||y>=R)return;
  if(Math.hypot(p.x-(M+x*U),p.y-(M+y*U))>U*.48)return;
  onBoard(x,y);
});
function renderList(){
  let s='';
  LV.forEach((name,lv)=>{const ids=DATA.map((p,i)=>i).filter(i=>DATA[i].lv===lv);const n=ids.filter(i=>solved.has(i)).length;
    s+='<h2>'+name+'<span>'+n+' / '+ids.length+'</span></h2><div class="nums">';
    ids.forEach(i=>{s+='<button data-i="'+i+'" class="'+(solved.has(i)?'solved ':'')+(i===cur?'cur':'')+'" aria-label="'+name+' 第'+idxInLv[i]+'問'+(solved.has(i)?'(正解済み)':'')+'">'+idxInLv[i]+'</button>'});
    s+='</div>'});
  s+='<div class="foot"><span>黒く塗られた番号は正解済み</span><button id="clr">記録を消す</button></div>';
  $('list').innerHTML=s;
  $('list').querySelectorAll('.nums button').forEach(b=>b.onclick=()=>load(+b.dataset.i));
  $('clr').onclick=()=>{if(confirm('正解の記録をすべて消しますか?')){solved.clear();save();renderList()}};
  $('prog').innerHTML='全'+DATA.length+'問中 <b>'+solved.size+'</b> 問正解';
}
$('hintBtn').onclick=hint;
$('resetBtn').onclick=()=>{const h=hintLv,u=usedHelp;load(cur);hintLv=h;usedHelp=u;if(h===2)marks=Object.keys(node.ok).map(k=>k.split(',').map(Number));if(h)setMsg('hint',h===2?'急所はここ':'ヒント',P.hint);updButtons();render()};
$('ansBtn').onclick=demo;
$('nextBtn').onclick=()=>{if(cur<DATA.length-1)load(cur+1)};
const hintRaw=$('hintBtn').onclick;$('hintBtn').onclick=()=>{if(hintLv===1)usedHelp=true;hintRaw()};
let start=DATA.findIndex((p,i)=>!solved.has(i));load(start<0?0:start);
</script>
</body>
